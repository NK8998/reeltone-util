name: reeltone-local

x-server-build: &server-build
  context: ../reeltone-server
  target: development

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5433}:5432"

  migrate-auth:
    image: reeltone-server:development
    build: *server-build
    command: ["node", "--import", "tsx", "src/auth/migrate.ts"]
    volumes:
      - ../reeltone-server/src:/app/src:ro
      - ../reeltone-server/migrations:/app/migrations:ro

  migrate-reviews:
    image: reeltone-server:development
    build: *server-build
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["node", "--import", "tsx", "src/reviews/migrate.ts"]
    environment:
      REVIEWS_LEGACY_SQLITE_FILE: ""
      REVIEWS_LEGACY_SESSIONS_FILE: ""
    volumes:
      - ../reeltone-server/src:/app/src:ro
      - ../reeltone-server/reviews/db/migrations:/app/reviews/db/migrations:ro

  reeltone-server:
    image: reeltone-server:development
    build: *server-build
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - ../reeltone-server/reviews/.env
      - ../reeltone-server/.env
    environment:
      NODE_ENV: development
      APP_ENV: development
      AUTH_ISSUER: http://localhost:3000
      AUTH_INTERNAL_URL: http://127.0.0.1:3000
      AUTH_TRUST_PROXY: "0"
      AUTH_JWKS_FILE: /app/.keys/oidc.json
      REVIEWS_ORIGIN: http://localhost:3101
    volumes:
      - ../reeltone-server/.keys:/app/.keys:ro
      - ../reeltone-server/src:/app/src:ro
      - ../reeltone-server/tsconfig.json:/app/tsconfig.json:ro
      - ../reeltone-server/streaming:/app/streaming:ro
    ports:
      - "127.0.0.1:3000:3000"

  reeltone-reviews-web:
    image: reeltone-reviews-web:development
    init: true
    build:
      context: ../reeltone-reviews
      target: development
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3101
    volumes:
      - ../reeltone-reviews/src:/app/src:ro
      - ../reeltone-reviews/public:/app/public:ro
      - ../reeltone-reviews/next.config.ts:/app/next.config.ts:ro
      - ../reeltone-reviews/postcss.config.mjs:/app/postcss.config.mjs:ro
      - ../reeltone-reviews/tsconfig.json:/app/tsconfig.json:ro
    ports:
      - "127.0.0.1:3101:3000"

  reeltone-stream-web:
    image: reeltone-stream-web:development
    build:
      context: ../reeltone-stream
      target: development
    volumes:
      - ../reeltone-stream/src:/app/src:ro
      - ../reeltone-stream/public:/app/public:ro
      - ../reeltone-stream/data:/app/data:ro
      - ../reeltone-stream/next.config.ts:/app/next.config.ts:ro
      - ../reeltone-stream/tsconfig.json:/app/tsconfig.json:ro
    ports:
      - "127.0.0.1:${STREAM_LOCAL_PORT:-3102}:3000"

networks:
  database:
    internal: false
