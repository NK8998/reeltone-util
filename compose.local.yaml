name: reeltone-local

x-auth-source: &auth-source
  - ../reeltone-auth/src:/app/src:ro
  - ../reeltone-auth/migrations:/app/migrations:ro

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5433}:5432"

  migrate-auth:
    image: reeltone-auth:development
    build: &auth-build
      context: ../reeltone-auth
      target: development
    command: ["node", "--import", "tsx", "src/migrate.ts"]
    volumes: *auth-source

  reeltone-auth:
    image: reeltone-auth:development
    build: *auth-build
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file: ../reeltone-auth/.env
    environment:
      NODE_ENV: development
      AUTH_ISSUER: http://localhost:3000
      AUTH_TRUST_PROXY: "0"
      AUTH_JWKS_FILE: /app/.keys/oidc.json
    volumes:
      - ../reeltone-auth/.keys:/app/.keys:ro
      - ../reeltone-auth/src:/app/src:ro
      - ../reeltone-auth/tsconfig.json:/app/tsconfig.json:ro
    ports:
      - "127.0.0.1:3000:3000"

  migrate-reviews:
    build: &reviews-build ../reeltone-reviews/server
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    environment:
      REVIEWS_LEGACY_SQLITE_FILE: /legacy/reeltone.db
      REVIEWS_LEGACY_SESSIONS_FILE: /legacy/reviews-sessions.sqlite3
    volumes:
      - ../reeltone-reviews/server:/workspace:ro
      - ../reeltone-reviews/server/db:/legacy:ro

  reeltone-reviews-api:
    build: *reviews-build
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    command:
      - python
      - -m
      - flask
      - --app
      - app
      - run
      - --host
      - 0.0.0.0
      - --port
      - "8888"
      - --reload
      - --no-debugger
      - --exclude-patterns
      - "/workspace/.venv/*:/workspace/venv/*"
    env_file: ../reeltone-reviews/server/.env
    environment:
      APP_ENV: development
      AUTH_ISSUER: http://localhost:3000
      AUTH_INTERNAL_URL: http://reeltone-auth:3000
      REVIEWS_ORIGIN: http://localhost:3101
    volumes:
      - ../reeltone-reviews/server:/workspace:ro

  reeltone-reviews-web:
    image: reeltone-reviews-web:development
    init: true
    build:
      context: ../reeltone-reviews/client
      target: development
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3101
    volumes:
      - ../reeltone-reviews/client/src:/app/src:ro
      - ../reeltone-reviews/client/public:/app/public:ro
      - ../reeltone-reviews/client/next.config.ts:/app/next.config.ts:ro
      - ../reeltone-reviews/client/postcss.config.mjs:/app/postcss.config.mjs:ro
      - ../reeltone-reviews/client/tsconfig.json:/app/tsconfig.json:ro
    ports:
      - "127.0.0.1:3101:3000"

networks:
  database:
    internal: false
