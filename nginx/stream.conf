server {
    listen 80;
    server_name stream.reeltone.site;
    access_log /var/log/nginx/access.log reeltone;
    return 308 https://stream.reeltone.site$request_uri;
}

server {
    listen 443 ssl;
    server_name stream.reeltone.site;
    access_log /var/log/nginx/access.log reeltone;

    ssl_certificate /etc/nginx/tls/stream/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/stream/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stream_upstream reeltone-stream-web:3000;
        proxy_pass http://$stream_upstream;
        proxy_set_header Host stream.reeltone.site;
        proxy_set_header X-Forwarded-Host stream.reeltone.site;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
