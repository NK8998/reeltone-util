server {
    listen 80;
    server_name reviews.reeltone.site;
    access_log /var/log/nginx/access.log reeltone;
    return 308 https://reviews.reeltone.site$request_uri;
}

server {
    listen 443 ssl;
    server_name reviews.reeltone.site;
    access_log /var/log/nginx/access.log reeltone;

    ssl_certificate /etc/nginx/tls/reviews/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/reviews/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $reviews_upstream reeltone-reviews-web:3000;
        proxy_pass http://$reviews_upstream;
        proxy_set_header Host reviews.reeltone.site;
        proxy_set_header X-Forwarded-Host reviews.reeltone.site;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
