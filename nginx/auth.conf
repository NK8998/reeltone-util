log_format reeltone '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name auth.reeltone.site;
    access_log /var/log/nginx/access.log reeltone;
    return 308 https://auth.reeltone.site$request_uri;
}

server {
    listen 443 ssl;
    server_name auth.reeltone.site;
    access_log /var/log/nginx/access.log reeltone;

    ssl_certificate /etc/nginx/tls/auth/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/auth/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auth_upstream reeltone-auth:3000;
        proxy_pass http://$auth_upstream;
        proxy_set_header Host auth.reeltone.site;
        proxy_set_header X-Forwarded-Host auth.reeltone.site;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
